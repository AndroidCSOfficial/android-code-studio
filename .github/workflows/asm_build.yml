name: Build Android Code Studio

on:
  push:
    branches: 
      - "dev"
      - "main" 
      - "indexing"
      - "release/**"
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      version:
        description: 'Release version'
        required: true
        default: 'v1.0.0+gh.r05'
        type: string

jobs:
  build_release_apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
          
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Determine Build Type Configuration
        run: |
          SELECTED_TYPE="${{ github.event.inputs.build_type }}"
          BUILD_TYPE="${SELECTED_TYPE:-Debug}"
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "BUILD_TYPE_LOWER=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          INPUT_VERSION="${{ github.event.inputs.version }}"
          echo "VERSION=${INPUT_VERSION:-v1.0.0+gh.r05}" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list 2>/dev/null | grep -i "platforms;android-37" || true
          for pkg in "platforms;android-37.0" "platforms;android-37"; do
            "$SDKMANAGER" "$pkg" && break
          done
          cd "$ANDROID_HOME/platforms"
          ls
          if [ ! -d android-37 ] && [ -d android-37.0 ]; then
            ln -s android-37.0 android-37
          fi
          test -f android-37/android.jar

      - name: Generating missing dirs
        run: |
          mkdir -p /home/runner/work/android-code-studio/android-code-studio/core/app/build/intermediates/external_file_lib_dex_archives/debug/desugarDebugFileDependencies
          mkdir -p /home/runner/work/android-code-studio/android-code-studio/core/app/build/intermediates/l8_art_profile/release/l8DexDesugarLibRelease
          mkdir -p /home/runner/work/android-code-studio/android-code-studio/composite-builds/build-logic/desugaring-core

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate no-sign init script
        run: |
          cat > ~/no-sign.init.gradle << 'EOF'
          gradle.projectsEvaluated {
              rootProject.allprojects { p ->
                  def s = p.extensions.findByName("signing")
                  if (s != null) {
                      s.required = false
                  }
              }
          }
          EOF

      - name: Build and publish sora-editor to Maven Local
        run: |
          git clone --depth 1 https://github.com/nullij/sora-editor.git ~/sora-editor
          cd ~/sora-editor
          VERSIONS_FILE=build-logic/convention/src/main/kotlin/Versions.kt
          sed -i 's/private const val version = "0.24.6"/private const val version = "0.24.7-acs"/' "$VERSIONS_FILE"
          sed -i 's/const val versionCode = 95/const val versionCode = 96/' "$VERSIONS_FILE"
          grep -nE 'const val (version|versionCode) =' "$VERSIONS_FILE"
          chmod +x ./gradlew
          ./gradlew :editor:publishToMavenLocal -I ~/no-sign.init.gradle
          find ~/.m2/repository -name "*.pom" | grep -i editor

      - name: Create local.properties
        run: |
          echo "signing.storeFile=signing/signing-key.jks" >> local.properties
          echo "signing.storePassword=${{ secrets.SIGNING_SK_PASSWORD }}" >> local.properties
          echo "signing.keyAlias=androidcs" >> local.properties
          echo "signing.keyPassword=${{ secrets.SIGNING_SK_PASSWORD }}" >> local.properties

      - name: Assemble APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          env SIGNING_STORE_PASSWORD="$SIGNING_STORE_PASSWORD" \
              SIGNING_KEY_PASSWORD="$SIGNING_KEY_PASSWORD" \
              ./gradlew assemble${{ env.BUILD_TYPE }} -DSIGNING_STORE_PASSWORD="$SIGNING_STORE_PASSWORD" -DSIGNING_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"

      - name: Rename APKs
        run: |
          cd core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            for f in *"$abi"*.apk; do
              if [ -f "$f" ]; then
                mv "$f" "android-code-studio-${abi}-${BUILD_TYPE_LOWER}-${VERSION}.apk"
              fi
            done
          done

      - name: List APK files
        run: ls -la core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}/ || echo "Directory not found"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-${{ env.BUILD_TYPE_LOWER }}
          path: core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}/*arm64-v8a*.apk
        if: always()

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a-${{ env.BUILD_TYPE_LOWER }}
          path: core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}/*armeabi-v7a*.apk
        if: always()


      - name: Publish GitHub Release
        if: env.BUILD_TYPE == 'Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: core/app/build/outputs/apk/release/android-code-studio-*.apk
